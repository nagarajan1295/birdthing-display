<!-- ===== iPhone notification display (ANCS) ==================================
     Self-contained. Patch-time globals set the DEFAULTS:

       window.ANCS_URL    endpoint to poll (gateway, or a same-origin proxy)
       window.ANCS_FS     CSS length for the base font size. Everything else is
                          in em, so pass the host page's OWN scale here and the
                          notification tracks that screen's typography:
                            BirdThing     calc(21px * var(--ts,1))
                            WeatherThing  calc(30px * var(--uiscale,1))
                            kiosk         clamp(1.3rem, 2vw, 1.9rem)
       window.ANCS_STYLE  'toast' | 'full'   default layout
       window.ANCS_THEME  'light' for light pages with no body.light
       window.ANCS_STATUS_SLOT    CSS selector of a status row to put the
                                  phone-link glyph inside (BirdThing: '.top .tr')
       window.ANCS_STATUS_ANCHOR  CSS selector of an existing status icon to
                                  sit just LEFT of, so they never overlap
                                  (WeatherThing: '#btStatus')
       window.ANCS_STATUS         'tr'|'tl'|'br'|'bl'|'off' corner fallback

     NOTIFICATION CENTRE: tap the phone glyph, or swipe down from the top-right
     corner, for an iOS-style list of everything still on the phone (feed items
     with no removed_ts). Swipe up / tap the backdrop to close. Gesture
     listeners are on `document` and only fire on a real vertical drag, so the
     host's own top-bar taps (clock etc.) still work.

     ---- CHECKLIST for any change here (do ALL before saying it's fixed) ------
       [ ] UI:      glyph + toast + notification centre on ALL THREE displays,
                    at every text size, no overlap with the clock / wifi /
                    bluetooth / chips, no horizontal page scroll, light AND dark.
       [ ] FUNCTION: a notification that arrives while the screen is up toasts
                    once; one that arrives during a reload still toasts; one
                    the user reads on their PHONE a second later (removed_ts
                    set almost immediately) STILL toasts - removed_ts only
                    drops the badge, it must never gate the toast.
                    Test with a real removed_ts item, not just /api/test.
       [ ] STABILITY: survives a reload / kiosk-watchdog relaunch / reboot
                    (localStorage: ancsOn, ancsSeenV1). No burst on cold start.
       [ ] SYNC:    same notify_widget.html injected on all three; repo pushed;
                    gateway + proxies agree.
       [ ] VERIFY:  reload each display and read its LIVE DOM / screenshot -
                    never trust a deploy without looking.
     -------------------------------------------------------------------------

     The user then overrides size / fullscreen / duration / on-off from the
     host page's own Settings screen - this script INJECTS those rows into
     #settings .vbody at runtime rather than editing the dashboards, so both
     Car Things get the identical panel and stay consistent. Choices live in
     localStorage and apply immediately.

     PERFORMANCE: no backdrop-filter, no infinite animations, opacity-only
     transitions. The Car Things composite in software on an Amlogic GPU while
     their own UI repaints constantly (the WeatherThing redraws an analog clock
     every 200ms) - blur layers and looping transforms made this visibly glitch.
     Canonical source: E:\BirdThing\ancs\notify_widget.html
============================================================================ -->
<style>
  #ancsWrap{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;
    flex-direction:column;align-items:center;gap:.5em;padding:.6em;
    pointer-events:none;}
  #ancsWrap.full{top:0;bottom:0;padding:0;gap:0;}

  .ancs{pointer-events:auto;box-sizing:border-box;
    font-family:'Inter',-apple-system,system-ui,"Helvetica Neue",sans-serif;
    font-size:var(--ancs-fs,21px);
    background:#1c1c1e;color:#f5f5f7;
    border:1px solid rgba(255,255,255,.16);
    opacity:0;transition:opacity .32s ease;}
  .ancs.in{opacity:1;}
  body.light .ancs,.ancs.light{background:#fff;color:#1c1c1e;
    border-color:rgba(0,0,0,.12);}

  /* ---- toast layout ---- */
  .ancs.toast{width:100%;max-width:44em;display:flex;align-items:center;
    gap:.8em;padding:.7em .95em;border-radius:.95em;
    box-shadow:0 .5em 1.6em rgba(0,0,0,.5);}
  .ancs.toast .ancs-ico{flex:0 0 auto;width:2.3em;height:2.3em;
    border-radius:.62em;display:flex;align-items:center;justify-content:center;
    font-size:1.15em;background:rgba(255,255,255,.14);}
  body.light .ancs.toast .ancs-ico,.ancs.toast.light .ancs-ico{
    background:rgba(0,0,0,.07);}
  .ancs.toast .ancs-body{flex:1 1 auto;min-width:0;}
  .ancs.toast .ancs-app{font-size:.62em;font-weight:600;letter-spacing:.09em;
    text-transform:uppercase;opacity:.62;margin-bottom:.15em;}
  .ancs.toast .ancs-title{font-size:1.12em;font-weight:600;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;line-height:1.2;}
  .ancs.toast .ancs-msg{font-size:.95em;opacity:.8;line-height:1.3;
    margin-top:.12em;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden;}
  .ancs.toast.call{border-color:rgba(48,209,88,.6);}
  .ancs.toast.call .ancs-ico{background:rgba(48,209,88,.22);color:#30d158;}

  /* ---- fullscreen layout ---- */
  .ancs.full{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;
    border:0;border-radius:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    padding:1em 1.2em;gap:.35em;
    transition:opacity .9s ease;}   /* fade-out slower than fade-in */
  .ancs.full.in{transition:opacity .3s ease;}
  .ancs.full .ancs-ico{font-size:2.3em;line-height:1;margin-bottom:.15em;}
  .ancs.full .ancs-app{font-size:.62em;font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;opacity:.6;}
  .ancs.full .ancs-title{font-size:1.55em;font-weight:700;line-height:1.12;
    max-width:96%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ancs.full .ancs-msg{font-size:.98em;opacity:.85;line-height:1.28;
    max-width:94%;display:-webkit-box;-webkit-line-clamp:3;
    -webkit-box-orient:vertical;overflow:hidden;}
  .ancs.full.call{background:#06240f;color:#eafff0;}
  .ancs.full.call .ancs-app{color:#30d158;opacity:1;}
  body.light .ancs.full.call,.ancs.full.call.light{background:#e8fbee;
    color:#042c12;}

  /* selected state for the injected settings buttons */
  #settings .ancs-sel{background:var(--accent,#0a84ff)!important;
    color:#fff!important;border-color:transparent!important;}

  @media (prefers-reduced-motion:reduce){.ancs{transition:opacity .15s;}}

  /* ---- persistent phone-link status glyph (top-right, like wifi/bluetooth) ---- */
  #ancsStat{--s:1;pointer-events:none;display:inline-flex;align-items:center;
    justify-content:center;position:relative;width:calc(1.15em*var(--s));
    height:calc(1.15em*var(--s));flex:0 0 auto;color:currentColor;opacity:.32;
    transition:opacity .4s ease;vertical-align:middle;}
  #ancsStat.linked{opacity:.9;}
  #ancsStat svg{width:100%;height:100%;display:block;}
  #ancsStat .slash{opacity:1;transition:opacity .4s ease;}
  #ancsStat.linked .slash{opacity:0;}
  #ancsStat .badge{position:absolute;top:-.15em;right:-.2em;min-width:.95em;
    height:.95em;padding:0 .16em;box-sizing:border-box;border-radius:.55em;
    background:#ff3b30;color:#fff;font:600 .62em/.95em 'Inter',system-ui,sans-serif;
    text-align:center;display:none;}
  #ancsStat.has-badge .badge{display:block;}
  /* fixed-corner fallback: no host status row to inherit a colour from, and
     the page may be light OR dark - mid-grey at half opacity reads on both */
  #ancsStat.fixed{position:fixed;z-index:180;width:22px;height:22px;
    font-size:16px;color:#8a8a8e!important;opacity:.5;}
  #ancsStat.fixed.linked{opacity:.95;}
  #ancsStat.fixed.tr{top:6px;right:8px;}
  #ancsStat.fixed.tl{top:6px;left:8px;}
  #ancsStat.fixed.br{bottom:6px;right:8px;}
  #ancsStat.fixed.bl{bottom:6px;left:8px;}
  /* .anchored: JS pins top/right next to an existing status icon (e.g. the
     WeatherThing's #btStatus) so the two never overlap */
  #ancsStat.fixed.anchored{top:0;right:0;}
  @keyframes ancsPing{0%{transform:scale(1);}35%{transform:scale(1.35);}100%{transform:scale(1);}}
  #ancsStat.ping{animation:ancsPing .7s ease;}
  #ancsStat.tappable{pointer-events:auto;cursor:pointer;}

  /* ---- notification centre: swipe down from the top-right, or tap the glyph ---- */
  #ancsCtrBack{position:fixed;inset:0;z-index:205;background:rgba(0,0,0,.45);
    opacity:0;pointer-events:none;transition:opacity .25s ease;}
  #ancsCtrBack.open{opacity:1;pointer-events:auto;}
  #ancsCtr{position:fixed;top:0;left:0;right:0;z-index:210;
    max-height:88%;display:flex;flex-direction:column;
    transform:translateY(-102%);transition:transform .28s cubic-bezier(.3,.9,.3,1);
    font-family:'Inter',-apple-system,system-ui,sans-serif;
    background:#111113;color:#f5f5f7;
    border-bottom:1px solid rgba(255,255,255,.12);
    box-shadow:0 1.2em 3em rgba(0,0,0,.55);}
  #ancsCtr.open{transform:translateY(0);}
  body.light #ancsCtr,#ancsCtr.light{background:#f4f4f6;color:#1c1c1e;
    border-bottom-color:rgba(0,0,0,.12);}
  #ancsCtr .ctr-head{flex:0 0 auto;display:flex;align-items:baseline;
    justify-content:space-between;padding:calc(14px*var(--s,1)) calc(20px*var(--s,1)) calc(8px*var(--s,1));}
  #ancsCtr .ctr-title{font-size:calc(15px*var(--s,1));font-weight:700;
    letter-spacing:.03em;text-transform:uppercase;opacity:.7;}
  #ancsCtr .ctr-hint{font-size:calc(12px*var(--s,1));opacity:.4;}
  #ancsCtr .ctr-list{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:0 calc(12px*var(--s,1)) calc(14px*var(--s,1));display:flex;
    flex-direction:column;gap:calc(8px*var(--s,1));}
  #ancsCtr .ctr-swipe{position:relative;overflow:hidden;border-radius:calc(14px*var(--s,1));
    /* flex-shrink:0 is required, not cosmetic: .ctr-list is a column flex
       container, and an overflow:hidden flex item's automatic minimum size
       is 0 (spec quirk - overflow:visible items instead default to their
       content size as the minimum) - without this every row got squashed
       down to a fraction of its content height, clipping the message text. */
    flex:0 0 auto;}
  #ancsCtr .ctr-swipe-bg{position:absolute;inset:0;display:flex;align-items:center;
    justify-content:flex-end;padding-right:calc(18px*var(--s,1));background:#ff3b30;
    color:#fff;font-size:calc(13px*var(--s,1));font-weight:600;}
  #ancsCtr .ctr-row{display:flex;gap:calc(11px*var(--s,1));align-items:flex-start;
    /* OPAQUE, not translucent - this sits directly above .ctr-swipe-bg's red
       "Clear" reveal, which a translucent row would let bleed through before
       any swipe happened. Solid colour = rgba(255,255,255,.07) pre-blended
       onto the panel's own #111113 background. */
    background:#242426;border-radius:calc(14px*var(--s,1));
    padding:calc(11px*var(--s,1)) calc(13px*var(--s,1));position:relative;
    transition:transform .2s ease;touch-action:pan-y;}
  body.light #ancsCtr .ctr-row,#ancsCtr.light .ctr-row{background:#e8e8ea;}
  #ancsCtr .ctr-row.dragging{transition:none;}
  /* knob-scroll focus ring - only visible while the knob is being used to
     move through the list, matches the accent used elsewhere for selection */
  #ancsCtr .ctr-row.focused{box-shadow:0 0 0 calc(2px*var(--s,1)) #0a84ff inset;}
  body.light #ancsCtr .ctr-row.focused,#ancsCtr.light .ctr-row.focused{box-shadow:0 0 0 calc(2px*var(--s,1)) #007aff inset;}
  #ancsCtr .ctr-msg.expanded{-webkit-line-clamp:unset;}
  #ancsCtr .ctr-clearall{flex:0 0 auto;align-self:center;margin:calc(4px*var(--s,1)) 0 0;
    padding:calc(9px*var(--s,1)) calc(18px*var(--s,1));border-radius:999px;border:0;
    background:rgba(255,59,48,.16);color:#ff453a;font:600 calc(13px*var(--s,1))/1 'Inter',system-ui,sans-serif;
    letter-spacing:.02em;}
  body.light #ancsCtr .ctr-clearall,#ancsCtr.light .ctr-clearall{background:rgba(255,59,48,.12);color:#d70015;}
  #ancsCtr .ctr-ico{flex:0 0 auto;width:calc(30px*var(--s,1));height:calc(30px*var(--s,1));
    border-radius:calc(8px*var(--s,1));display:flex;align-items:center;
    justify-content:center;font-size:calc(16px*var(--s,1));background:rgba(255,255,255,.12);}
  body.light #ancsCtr .ctr-ico,#ancsCtr.light .ctr-ico{background:rgba(0,0,0,.08);}
  #ancsCtr .ctr-body{flex:1 1 auto;min-width:0;}
  #ancsCtr .ctr-top{display:flex;justify-content:space-between;gap:8px;
    font-size:calc(11px*var(--s,1));font-weight:600;letter-spacing:.06em;
    text-transform:uppercase;opacity:.55;margin-bottom:calc(2px*var(--s,1));}
  #ancsCtr .ctr-name{font-size:calc(15px*var(--s,1));font-weight:600;line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #ancsCtr .ctr-msg{font-size:calc(13.5px*var(--s,1));opacity:.82;line-height:1.32;
    margin-top:calc(2px*var(--s,1));display:-webkit-box;-webkit-line-clamp:4;
    -webkit-box-orient:vertical;overflow:hidden;}
  #ancsCtr .ctr-empty{padding:calc(30px*var(--s,1)) 0 calc(40px*var(--s,1));
    text-align:center;opacity:.4;font-size:calc(14px*var(--s,1));}
  #ancsCtr .ctr-grip{flex:0 0 auto;align-self:center;width:38px;height:4px;
    border-radius:2px;background:rgba(255,255,255,.25);margin:calc(7px*var(--s,1)) 0 0;}
  body.light #ancsCtr .ctr-grip,#ancsCtr.light .ctr-grip{background:rgba(0,0,0,.2);}
</style>
<script>
(function(){
  var URL_ = window.ANCS_URL || '/api/notify';
  // Which screen this is, so the central per-device on/off can address it.
  // Set at patch time: birdthing | weatherthing | kiosk.
  var DEVICE = window.ANCS_DEVICE || 'birdthing';
  // Central settings, delivered inside the notification feed itself so there
  // is no second request. Local prefs stay for per-screen cosmetics (size,
  // full-screen); anything that must be the SAME everywhere lives here.
  var CENTRAL = null;
  var POLL = window.ANCS_POLL_MS || 2500;
  var BASE_FS = window.ANCS_FS || '21px';
  var DEF_FULL = window.ANCS_STYLE === 'full';

  // ---- user settings (host page's Settings screen writes these) ----
  function ls(k, d){ try { var v = localStorage.getItem(k);
    return v === null ? d : v; } catch(e){ return d; } }
  function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

  var S = {
    on:    ls('ancsOn','1') === '1',
    scale: parseFloat(ls('ancsScale','1')) || 1,
    full:  ls('ancsFull', DEF_FULL ? '1' : '0') === '1',
    hold:  parseInt(ls('ancsHold','6'), 10) || 6
  };

  var wrap = document.createElement('div');
  wrap.id = 'ancsWrap';
  document.body.appendChild(wrap);

  function applyStyle(){
    wrap.className = S.full ? 'full' : '';
    // the host's own scale variable is inside BASE_FS, so this multiplies the
    // screen's real typography by the user's notification-size preference
    wrap.style.setProperty('--ancs-fs',
      'calc((' + BASE_FS + ') * ' + S.scale + ')');
  }
  applyStyle();

  // ---- persistent phone-link status glyph -------------------------------
  // Shows in the top-right of every display, next to the wifi/bluetooth-style
  // indicators: a phone icon that is bright when the iPhone is linked to the
  // ANCS hub and dimmed+slashed when it is not, with a red count badge for how
  // many notifications the phone is currently showing. window.ANCS_STATUS_SLOT
  // is a CSS selector to place it inline inside the host's own status row;
  // window.ANCS_STATUS ('tr'|'tl'|'br'|'bl'|'off') is the fixed-corner
  // fallback used when no slot is found. Default: inline if a known status row
  // exists, else fixed top-right.
  var STAT_SLOT   = window.ANCS_STATUS_SLOT || null;
  var STAT_ANCHOR = window.ANCS_STATUS_ANCHOR || null;  // sit just left of this element
  var STAT_POS    = window.ANCS_STATUS || 'tr';
  var statEl = null, statBadge = null, lastCount = -1, statLinked = null;

  function buildStat(){
    if (STAT_POS === 'off') return;
    var host = null;
    if (STAT_SLOT) host = document.querySelector(STAT_SLOT);
    if (!host && !STAT_ANCHOR) {
      var known = ['.top .tr', '.status-stack', '.statusbar', '#statusbar',
                   '.status-icons', '.sysicons', '#sysbar'];
      for (var i = 0; i < known.length && !host; i++)
        host = document.querySelector(known[i]);
    }
    statEl = document.createElement('span');
    statEl.id = 'ancsStat';
    // inherit the host status row's colour when slotted in; when slotted into a
    // light page that has no body.light, force a dark glyph. The fixed-corner
    // fallback ignores this (its CSS pins a mid-grey that works on any bg).
    if (host && window.ANCS_THEME === 'light') statEl.style.color = '#1c1c1e';
    // phone outline + a slash line that hides when linked
    statEl.innerHTML =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" '
      + 'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
      + '<rect x="7" y="2" width="10" height="20" rx="2.2"></rect>'
      + '<line x1="11" y1="18" x2="13" y2="18"></line>'
      + '<line class="slash" x1="3" y1="21" x2="21" y2="3"></line></svg>'
      + '<span class="badge">0</span>';
    statBadge = statEl.querySelector('.badge');
    statEl.classList.add('tappable');
    statEl.addEventListener('click', function(e){ e.stopPropagation(); toggleCenter(); });
    if (host) {
      host.appendChild(statEl);
      return;
    }
    var anchor = STAT_ANCHOR ? document.querySelector(STAT_ANCHOR) : null;
    if (anchor) {
      statEl.className = 'fixed anchored';
      document.body.appendChild(statEl);
      var place = function(){
        var r = anchor.getBoundingClientRect();
        if (!r.width && !r.height) return;   // anchor not laid out yet
        statEl.style.top = Math.round(r.top + r.height / 2
          - statEl.offsetHeight / 2) + 'px';
        statEl.style.right = Math.round(window.innerWidth - r.left + 10) + 'px';
      };
      place();
      setTimeout(place, 400);
      setTimeout(place, 1500);
      window.addEventListener('resize', place);
    } else {
      statEl.className = 'fixed ' + STAT_POS;
      document.body.appendChild(statEl);
    }
  }

  function statSet(linked, count){
    if (!statEl) return;
    if (linked !== statLinked) {
      statEl.classList.toggle('linked', !!linked);
      statLinked = linked;
    }
    count = count || 0;
    if (count !== lastCount) {
      statBadge.textContent = count > 9 ? '9+' : String(count);
      statEl.classList.toggle('has-badge', count > 0);
      if (count > lastCount && lastCount >= 0) {
        statEl.classList.remove('ping');
        void statEl.offsetWidth;            // restart the animation
        statEl.classList.add('ping');
      }
      lastCount = count;
    }
  }

  // seen[uid] = { el?, timer?, full?, seeded? }  - this session's live view.
  var seen = Object.create(null);
  var queue = [], current = null;

  // -- reload-safe "already handled" set --------------------------------
  // The displays reload a lot (kiosk-watchdog relaunch, crash, network blip,
  // deploy). Seeding the WHOLE feed as "seen" on the first poll after every
  // load ate any notification that arrived in the reload gap - already in the
  // feed on that first poll, so it never toasted.
  // We remember handled ids in localStorage. The id is the gateway's
  // `disp_uid`: a per-process counter seeded from int(time()*1000), so it is
  // monotonic within a run and a restart jumps it forward past every earlier
  // value - no cross-session collision. Pruned to 24h.
  // IMPORTANT: this only decides "already TOASTED once" - it must never be the
  // reason a fresh notification is skipped. New notifications always get a
  // brand-new (higher) disp_uid, so they are never in this set.
  // V2: V1 accumulated recycled disp_uids while the gateway had the
  // EVT_ADDED-merges-into-a-reused-uid bug; abandon it wholesale.
  var SEEN_KEY = 'ancsSeenV2';
  function loadSeen(){
    var out = Object.create(null);
    try {
      localStorage.removeItem('ancsSeenV1');
      var raw = JSON.parse(localStorage.getItem(SEEN_KEY) || '{}');
      var cut = Date.now() - 864e5;
      for (var k in raw) if (raw[k] > cut) out[k] = raw[k];
    } catch(e){}
    return out;
  }
  var seenTs = loadSeen();
  var seenDirty = false, seenSaveAt = 0;
  function markSeen(uid){
    if (seenTs[uid] !== undefined) return;
    seenTs[uid] = Date.now(); seenDirty = true;
  }
  function flushSeen(){
    if (!seenDirty) return;
    var now = Date.now();
    if (now - seenSaveAt < 1500) return;
    seenSaveAt = now; seenDirty = false;
    try { localStorage.setItem(SEEN_KEY, JSON.stringify(seenTs)); } catch(e){}
  }
  // First run ever (nothing remembered): don't replay a backlog as a stack of
  // toasts - only surface ones from the last ~30s.
  var COLD_START = true;
  for (var _k in seenTs) { COLD_START = false; break; }

  var GLYPH = {IncomingCall:'\u{1F4DE}', MissedCall:'\u{1F4F5}', Voicemail:'\u{1F4FC}',
    Social:'\u{1F4AC}', Schedule:'\u{1F4C5}', Email:'\u2709\uFE0F', News:'\u{1F4F0}',
    HealthAndFitness:'\u2764\uFE0F', BusinessAndFinance:'\u{1F4B3}',
    Location:'\u{1F4CD}', Entertainment:'\u{1F3AC}', Other:'\u{1F514}'};
  var APP_GLYPH = {Messages:'\u{1F4AC}', WhatsApp:'\u{1F4AC}', Phone:'\u{1F4DE}',
    FaceTime:'\u{1F4F9}', Mail:'\u2709\uFE0F', Gmail:'\u2709\uFE0F',
    Calendar:'\u{1F4C5}', Clock:'\u23F0', Findmy:'\u{1F4CD}', Myq:'\u{1F6AA}'};
  function glyph(n){ return APP_GLYPH[n.app] || GLYPH[n.cat] || GLYPH.Other; }

  function fmtAge(sec){
    sec = Math.max(0, Math.round(sec || 0));
    if (sec < 45)   return 'now';
    if (sec < 3600) return Math.round(sec / 60) + 'm ago';
    if (sec < 86400) return Math.round(sec / 3600) + 'h ago';
    return Math.round(sec / 86400) + 'd ago';
  }

  // ---- notification centre: swipe down from the top-right (or tap the glyph)
  // to see everything still on the phone, iOS-style. Uses the same feed the
  // toasts do; a row = a notification the phone has NOT cleared.
  var ctr = null, ctrBack = null, ctrList = null, ctrOpen = false, ctrItems = [];
  function buildCenter(){
    ctrBack = document.createElement('div'); ctrBack.id = 'ancsCtrBack';

      if (k === 'mb1') on = CENTRAL.show_body !== false;
      else if (k === 'mb0') on = CENTRAL.show_body === false;
      else if (k.indexOf('d1_') === 0) on = (CENTRAL.devices || {})[k.slice(3)] !== false;
      else if (k.indexOf('d0_') === 0) on = (CENTRAL.devices || {})[k.slice(3)] === false;
      if (on !== null) b.classList.toggle('ancs-sel', on);
    });
  }

  function setHold(v){
    S.hold = Math.max(2, Math.min(30, v));
    lsSet('ancsHold', S.hold); mark();
  }
  function mark(){
    var p = document.getElementById('ancsPct');
    if (p) p.textContent = Math.round(S.scale * 100) + '%';
    var s = document.getElementById('ancsSec');
    if (s) s.textContent = S.hold + 's';
    var q = document.querySelectorAll('#ancsSet button[data-ancs]');
    Array.prototype.forEach.call(q, function(b){
      var k = b.dataset.ancs;
      var on = (k === 'on1' && S.on) || (k === 'on0' && !S.on)
            || (k === 'f1' && S.full) || (k === 'f0' && !S.full);
      b.classList.toggle('ancs-sel', on);
    });
  }

  // the settings view may not exist yet at load; retry briefly, then watch
  var tries = 0;
  var iv = setInterval(function(){
    injectSettings();
    if (document.getElementById('ancsSet') || ++tries > 40) clearInterval(iv);
  }, 250);

  buildCenter();
  buildStat();
  tick();
  setInterval(tick, POLL);
})();
</script>
